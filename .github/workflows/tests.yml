name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  blender:
    name: Blender ${{ matrix.blender }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - blender: "4.5.9"
            series: "4.5"
          - blender: "5.1.2"
            series: "5.1"
    steps:
      - uses: actions/checkout@v4

      - name: System libraries for Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 \
            libsm6 libice6 libgl1 libegl1 libglu1-mesa libxext6 libx11-6 > /dev/null

      - name: Cache Blender
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ matrix.blender }}-linux-x64

      - name: Download Blender ${{ matrix.blender }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender
          curl -sSL "https://download.blender.org/release/Blender${{ matrix.series }}/blender-${{ matrix.blender }}-linux-x64.tar.xz" \
            | tar -xJ -C ~/blender --strip-components=1

      - name: Run tests
        run: ~/blender/blender -b --factory-startup --python-exit-code 1 --python tests/run_tests.py
