name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! A small model or a screenshot that shows the problem helps a lot.
  - type: input
    id: bakedown
    attributes:
      label: BakeDown version
      description: Shown in the panel title, e.g. "BakeDown · v1.4.1"
    validations:
      required: true
  - type: input
    id: blender
    attributes:
      label: Blender version and OS
      placeholder: Blender 5.1.2, macOS 15 / Windows 11 / Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Simplify, Bake textures, LOD, Rig transfer, Export (Unity), Export (Unreal), Export (glTF), Python API / CLI, Interface / translation, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Import model.glb (≈50k triangles)
        2. Target 3000, click Simplify
        3. Click Bake (2K)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What happened and what you expected
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Error message / console output
      description: Window → Toggle System Console on Windows; start Blender from a terminal on macOS/Linux.
      render: text
